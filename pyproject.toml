[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MB-KSHBJQ"
version = "5.0.0"
description = "墨白可视化编辑 — 专业游戏数据编辑与管理平台，支持技能/角色/怪物等12种内置数据类型的可视化编辑、AI生成和多引擎导出"
authors = [
    {name = "墨白团队"}
]
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "PyQt6>=6.6.0,<7.0.0",
    "Pillow>=12.2.0,<13.0.0",
    "requests>=2.34.0,<3.0.0",
    "openai>=2.41.0,<3.0.0",
    "qtawesome>=1.4.2,<2.0.0",
    "markdown>=3.10.0,<4.0.0",
    "cryptography>=48.0.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.0",
    "ollama>=0.6.0",
    "Pygments>=2.20.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.0",
    "mypy>=2.1.0",
    "ruff>=0.15.0",
]
chromadb = [
    "chromadb>=0.4.0,<1.0.0",
]

[project.scripts]
game-editor = "src.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["scripts/archive", "docs/archive", "build", "dist"]

[tool.ruff.lint]
# 启用规则集：E(pycodestyle) F(pyflakes) I(isort) UP(pyupgrade) B(bugbear) W(warnings)
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",   # 行长度由 line-length 控制，不强制单行
    "B008",   # 函数默认值中调用函数（PyQt6 常见模式）
    "UP007",  # Optional[X] 与 X | None 并存期允许
    "UP045",  # Optional[X] 与 X | None 并存期允许
]

[tool.ruff.lint.isort]
known-first-party = ["src", "common", "core", "ui", "security", "features", "deployment", "config"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
warn_unused_configs = true
# 不强制全量类型注解（UI 层暂未覆盖）
check_untyped_defs = false
# 排除 UI 和测试目录的严格检查
exclude = [
    "src/ui/",
    "tests/",
    "scripts/",
    "build/",
]

[[tool.mypy.overrides]]
# 核心模块启用严格检查
module = ["src.core.*", "src.common.*", "src.security.*"]
check_untyped_defs = true
disallow_untyped_defs = false
