name: release-desktop

# 替代已移除的 早期版本 release.yml（PyInstaller）。
# 现役产品是 apps/desktop 下的 TypeScript + Electron 版，用 electron-builder 出跨平台安装包。
#
# 触发方式：
#   1. 打 tag `desktop-v*` 并推送 → 自动构建三平台安装包并发布为 GitHub Release（草稿）。
#   2. 手动触发（workflow_dispatch）→ 仅构建并上传产物（Artifacts），不发布 Release。
#
# 前置：包配置见 apps/desktop/package.json 的 `dist` 脚本与 `build` 段（electron-builder）。

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（仅用于手动触发时的产物命名，例如 0.1.0）'
        required: false
        default: 'manual'

jobs:
  package:
    name: 打包 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 无签名证书时关闭自动签名发现，避免 macOS 构建卡在等待 identity。
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建并打包（electron-vite build + electron-builder）
        working-directory: apps/desktop
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mobai-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: ignore

      - name: 发布 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
