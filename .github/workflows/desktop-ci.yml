name: desktop-ci

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        # 用 install 而非 ci：lockfile 在 Windows 生成，npm ci 不会补装
        # Linux 平台的原生可选依赖（rollup/esbuild），会导致单测与构建直接挂。
        run: npm install --no-audit --no-fund

      - name: 代码检查
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 端到端测试（含构建）
        run: xvfb-run -a npm run e2e