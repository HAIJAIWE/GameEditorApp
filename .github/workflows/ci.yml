name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports --warn-unused-ignores

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run unit, integration & ceshu tests with coverage
        run: |
          pytest tests --ignore=tests/e2e -v --tb=short --timeout=60 \
            --cov=src/core --cov=src/common --cov=src/security \
            --cov-report=term --cov-fail-under=25

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit

      - name: SAST (bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll -q

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run e2e tests
        run: pytest tests/e2e -v --tb=short --timeout=120
