name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - name: Type check (mypy)
        # MYPYPATH 指向 src/，使模块名按 common/core/ui 解析（与运行时 sys.path 一致）
        # 存量类型债务已于专项清零，mypy 覆盖全部 src/（含 UI），作为合并门禁
        run: MYPYPATH=src mypy src/ --ignore-missing-imports --warn-unused-ignores

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - name: Run unit, integration & ceshu tests with coverage
        run: |
          # 覆盖率覆盖全部 src/（含 UI），门槛渐进：25% → 30%（全 src 实测 32%）→ 40% → 60%
          pytest tests --ignore=tests/e2e -v --tb=short --timeout=60 \
            --cov=src \
            --cov-report=term --cov-report=term-missing --cov-fail-under=30

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit

      - name: SAST (bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll -q

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - name: Run e2e tests
        run: pytest tests/e2e -v --tb=short --timeout=120
